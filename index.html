<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anita Chaudhary – CV</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@700;800&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --accent: #1a3a5c;
        --accent-2: #3d6e9e;
        --accent-soft: #eef3f8;
        --text: #1c1c1c;
        --muted: #5a5a5a;
        --border: #e1e6ec;
      }

      body {
        font-family: 'Inter', Arial, sans-serif;
        color: var(--text);
        background: #dfe6ee;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 48px 56px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        font-family: 'Poppins', sans-serif;
        font-size: 1.6rem;
        color: var(--accent);
        margin-bottom: 8px;
      }

      p {
        color: var(--muted);
        margin-bottom: 28px;
      }

      .links {
        display: flex;
        gap: 16px;
        justify-content: center;
      }

      a.cv-link {
        display: inline-block;
        padding: 12px 28px;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        transition: background 0.2s;
      }

      a.cv-link:hover {
        background: var(--accent-2);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Anita Chaudhary</h1>
      <p>Choose a language / Choisissez une langue</p>
      <div class="links">
        <a class="cv-link" href="anita-chaudhary-cv-en.html">English</a>
        <a class="cv-link" href="anita-chaudhary-cv-fr.html">Français</a>
      </div>
    </div>
  </body>
</html>
