<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anita Chaudhary – CV</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@700;800&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --accent: #1a3a5c;
        --accent-2: #3d6e9e;
        --accent-soft: #eef3f8;
        --text: #1c1c1c;
        --muted: #5a5a5a;
        --border: #e1e6ec;
      }

      html, body {
        height: 100%;
      }

      body {
        font-family: 'Inter', Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 20% 20%, #2a4f78 0%, #142a40 45%, #0a151f 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
        perspective: 1200px;
      }

      /* Floating skill bubbles in the background */
      .bubbles {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      .bubble {
        position: absolute;
        left: var(--x);
        bottom: -160px;
        width: var(--size);
        height: var(--size);
        border-radius: 50%;
        background: radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.3), rgba(109, 168, 214, 0.14) 55%, rgba(61, 110, 158, 0.06) 100%);
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow: inset 0 0 14px rgba(255, 255, 255, 0.15), 0 0 12px rgba(109, 168, 214, 0.15);
        backdrop-filter: blur(2px);
        pointer-events: auto;
        cursor: default;
        animation: rise var(--dur) linear infinite;
        animation-delay: var(--delay);
        transition: box-shadow 0.3s ease, background 0.3s ease;
        will-change: transform;
      }

      .bubble:hover {
        box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.3), 0 0 30px rgba(109, 168, 214, 0.65);
        background: radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.45), rgba(109, 168, 214, 0.25) 55%, rgba(61, 110, 158, 0.15) 100%);
        animation-play-state: paused;
        z-index: 1;
      }

      .bubble-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 6%;
        color: #fff;
        font-weight: 600;
        font-size: var(--font-size, 0.7rem);
        line-height: 1.1;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }

      @keyframes rise {
        0% { transform: translate(0, 0); opacity: 0; }
        8% { opacity: 0.95; }
        25% { transform: translate(var(--wob1), -28vh); }
        50% { transform: translate(var(--wob2), -56vh); }
        75% { transform: translate(var(--wob3), -84vh); }
        92% { opacity: 0.9; }
        100% { transform: translate(var(--wob4), -125vh); opacity: 0; }
      }

      .intro {
        position: relative;
        z-index: 2;
        text-align: center;
        margin-bottom: 56px;
        transform-style: preserve-3d;
      }

      h1 {
        font-family: 'Poppins', sans-serif;
        font-size: 2.2rem;
        color: #fff;
        margin-bottom: 10px;
        letter-spacing: 0.5px;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
      }

      .intro p {
        color: #b9cbe0;
        font-size: 1rem;
      }

      .stage {
        position: relative;
        z-index: 2;
        display: flex;
        gap: 40px;
        perspective: 1000px;
      }

      .lang-card {
        position: relative;
        width: 220px;
        height: 280px;
        border-radius: 20px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
        border: 1px solid rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(8px);
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        transform-style: preserve-3d;
        transition: transform 0.12s ease-out, box-shadow 0.25s ease;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        will-change: transform;
        cursor: pointer;
      }

      .lang-card::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 20px;
        background: radial-gradient(circle 140px at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, 0.35), transparent 70%);
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
      }

      .lang-card:hover::before {
        opacity: 1;
      }

      .lang-card:hover {
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(109, 168, 214, 0.35);
      }

      .lang-name {
        font-family: 'Poppins', sans-serif;
        font-size: 1.2rem;
        font-weight: 700;
        color: #fff;
        transform: translateZ(30px);
      }

      .lang-sub {
        font-size: 0.82rem;
        color: #a9bdd4;
        transform: translateZ(20px);
      }

      footer {
        position: relative;
        z-index: 2;
        margin-top: 50px;
        color: #6f87a3;
        font-size: 0.8rem;
        letter-spacing: 0.3px;
      }

      @media (max-width: 540px) {
        .stage { flex-direction: column; }
        h1 { font-size: 1.7rem; }
      }
    </style>
  </head>
  <body>
    <div class="bubbles" id="bubbles"></div>

    <div class="intro">
      <h1>Anita Chaudhary</h1>
      <p>Choose a language / Choisissez une langue</p>
    </div>

    <div class="stage">
      <a class="lang-card" href="anita-chaudhary-cv-en.html" data-tilt>
        <span class="lang-name">English</span>
        <span class="lang-sub">View CV in English</span>
      </a>
      <a class="lang-card" href="anita-chaudhary-cv-fr.html" data-tilt>
        <span class="lang-name">Français</span>
        <span class="lang-sub">Voir le CV en français</span>
      </a>
    </div>

    <footer>Hover the cards · Click to open</footer>

    <script>
      const skills = [
        'Python', 'JavaScript', 'TypeScript', 'React.js', 'Next.js',
        'Vue.js', 'Three.js', 'Node.js', 'PostgreSQL', 'Docker',
        'Linux', 'Git', 'Tailwind CSS', 'REST APIs',
      ];

      const bubbleContainer = document.getElementById('bubbles');

      skills.forEach((skill) => {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        const size = 80 + Math.random() * 50;
        bubble.style.setProperty('--size', `${size}px`);
        bubble.style.setProperty('--x', `${Math.random() * 90}%`);
        bubble.style.setProperty('--dur', `${14 + Math.random() * 10}s`);
        bubble.style.setProperty('--delay', `${Math.random() * -20}s`);
        bubble.style.setProperty('--wob1', `${(Math.random() - 0.5) * 80}px`);
        bubble.style.setProperty('--wob2', `${(Math.random() - 0.5) * 80}px`);
        bubble.style.setProperty('--wob3', `${(Math.random() - 0.5) * 80}px`);
        bubble.style.setProperty('--wob4', `${(Math.random() - 0.5) * 80}px`);
        bubble.style.setProperty('--font-size', `${Math.max(0.55, size / 140)}rem`);

        const label = document.createElement('span');
        label.className = 'bubble-label';
        label.textContent = skill;

        bubble.appendChild(label);
        bubbleContainer.appendChild(bubble);
      });

      const cards = document.querySelectorAll('[data-tilt]');

      cards.forEach((card) => {
        const maxTilt = 16;

        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const px = x / rect.width;
          const py = y / rect.height;

          const rotateY = (px - 0.5) * maxTilt * 2;
          const rotateX = (0.5 - py) * maxTilt * 2;

          card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
          card.style.setProperty('--mx', `${px * 100}%`);
          card.style.setProperty('--my', `${py * 100}%`);
        });

        card.addEventListener('mouseleave', () => {
          card.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
        });
      });

    </script>
  </body>
</html>
