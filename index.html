<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anita Chaudhary – CV</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@700;800&family=Share+Tech+Mono&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --accent: #0d3a23;
        --accent-2: #2ecc71;
        --accent-soft: #eef3f8;
        --text: #1c1c1c;
        --muted: #5a5a5a;
        --border: #e1e6ec;
      }

      html, body {
        height: 100%;
      }

      body {
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        color: #b9f5d0;
        background: radial-gradient(circle at 20% 20%, #0a2418 0%, #051410 45%, #020a06 100%);
        min-height: 100vh;
        overflow: hidden;
        position: relative;
      }

      /* ============ LANDING ============ */
      .landing {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 50;
        transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.6, 0, 0.4, 1);
      }

      .landing.launching {
        opacity: 0;
        transform: scale(1.4);
        pointer-events: none;
      }

      .landing {
        background: #020a04;
      }

      .landing::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 2px,
          rgba(57, 255, 120, 0.035) 3px
        );
      }

      #wireframeGlobe {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
        pointer-events: none;
        opacity: 1;
        width: min(820px, 98vw);
        height: min(820px, 98vw);
      }

      .landing-content {
        position: relative;
        z-index: 2;
        text-align: center;
        width: 92%;
        max-width: 560px;
      }

      .terminal {
        background: #03130a;
        border: 1px solid #1f7a4c;
        border-radius: 8px;
        box-shadow: 0 0 50px rgba(40, 255, 130, 0.12), 0 18px 50px rgba(0, 0, 0, 0.6);
        font-family: 'Share Tech Mono', 'Courier New', monospace;
        text-align: left;
        overflow: hidden;
      }

      .terminal-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        background: rgba(57, 255, 120, 0.06);
        border-bottom: 1px solid rgba(57, 255, 120, 0.25);
      }

      .terminal-bar .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .terminal-bar .dot.red { background: #ff5f56; }
      .terminal-bar .dot.yellow { background: #ffbd2e; }
      .terminal-bar .dot.green { background: #27c93f; }

      .terminal-title {
        margin-left: auto;
        font-size: 0.72rem;
        color: #6fffb0;
        opacity: 0.7;
      }

      .terminal-body {
        padding: 20px 22px 24px;
        min-height: 230px;
        font-size: 0.92rem;
        line-height: 1.7;
        color: #4cffa0;
        text-shadow: 0 0 6px rgba(76, 255, 160, 0.45);
      }

      .terminal-line {
        white-space: pre-wrap;
        word-break: break-word;
      }

      .prompt {
        color: #7fffb0;
        margin-right: 8px;
      }

      .cmd-btn {
        background: none;
        border: none;
        padding: 0;
        font: inherit;
        color: #c8ffe4;
        cursor: pointer;
        text-decoration: underline dotted rgba(200, 255, 228, 0.5);
      }

      .cmd-btn:hover {
        color: #fff;
        text-shadow: 0 0 10px rgba(140, 255, 190, 0.8);
      }

      .sub-options {
        margin-left: 22px;
        display: none;
        flex-direction: column;
        gap: 4px;
      }

      .sub-options.open {
        display: flex;
      }

      .sub-options a {
        color: #9dffce;
        text-decoration: none;
      }

      .sub-options a:hover {
        color: #fff;
        text-decoration: underline;
      }

      .cursor-block {
        display: inline-block;
        width: 8px;
        height: 1em;
        background: #4cffa0;
        vertical-align: middle;
        animation: blink 1s steps(1) infinite;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      @media (max-width: 600px) {
        .terminal-body { font-size: 0.82rem; }
      }

      /* ============ DESKTOP ============ */
      .desktop {
        position: fixed;
        inset: 0;
        z-index: 10;
        opacity: 0;
        transform: scale(0.85);
        pointer-events: none;
        transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .desktop.active {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }

      .desktop-icons {
        position: absolute;
        top: 36px;
        left: 36px;
        display: flex;
        flex-direction: column;
        gap: 22px;
        z-index: 5;
      }

      .desktop-icon {
        width: 86px;
        background: none;
        border: none;
        color: #b9f5d0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        padding: 8px;
        border-radius: 10px;
        transition: background 0.15s ease;
      }

      .desktop-icon:hover,
      .desktop-icon:focus {
        background: rgba(57, 255, 120, 0.1);
      }

      .desktop-icon .icon-box {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: linear-gradient(145deg, rgba(57, 255, 120, 0.12), rgba(57, 255, 120, 0.03));
        border: 1px solid rgba(57, 255, 120, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
      }

      .desktop-icon .icon-box svg {
        width: 22px;
        height: 22px;
        stroke: #9dffce;
      }

      .desktop-icon span.label {
        font-size: 0.74rem;
        font-weight: 600;
        text-shadow: 0 0 6px rgba(70, 255, 150, 0.4);
        text-align: center;
      }

      .windows-layer {
        position: absolute;
        inset: 0;
        z-index: 6;
        pointer-events: none;
      }

      .window {
        pointer-events: auto;
        position: absolute;
        width: 420px;
        min-width: 280px;
        max-width: 92vw;
        max-height: 78vh;
        display: flex;
        flex-direction: column;
        background: rgba(4, 19, 12, 0.94);
        border: 1px solid rgba(57, 255, 120, 0.25);
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(57, 255, 120, 0.08);
        backdrop-filter: blur(14px);
        overflow: hidden;
        animation: pop-in 0.18s ease;
      }

      .window.minimized {
        display: none;
      }

      @keyframes pop-in {
        from { opacity: 0; transform: scale(0.92); }
        to { opacity: 1; transform: scale(1); }
      }

      .window-titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background: rgba(57, 255, 120, 0.06);
        border-bottom: 1px solid rgba(57, 255, 120, 0.25);
        cursor: grab;
        user-select: none;

      .window-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        font-weight: 700;
        color: #c8ffe4;
      }

      .window-title svg {
        width: 15px;
        height: 15px;
        stroke: #6fffb0;
        flex-shrink: 0;
      }

      .window-controls {
        display: flex;
        gap: 6px;
      }

      .win-btn {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: none;
        background: rgba(57, 255, 120, 0.1);
        color: #9dffce;
        font-size: 0.85rem;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s ease;

      .win-btn:hover {

      .window-body {

        color: #b9f5d0;

      .project-card {
        background: rgba(57, 255, 120, 0.04);

      .project-card .proj-title {

      .placeholder-box {

      .placeholder-box svg {

      .taskbar {
        position: absolute;

      @media (max-width: 600px) {
        .window { width: 92vw; }

    <script>
      /* ---------- Wireframe ASCII-style rotating globe ---------- */
      (function () {
        const canvas = document.getElementById('wireframeGlobe');
        const ctx = canvas.getContext('2d');
        canvas.width = 820;
        canvas.height = 820;
        const size = canvas.width;
        const cx = size / 2;
        const cy = size / 2;
        const radius = 360;
        const focal = 700;

        const latBands = 9;
        const lonBands = 16;
        const points = [];

        for (let i = 0; i <= latBands; i++) {
          const lat = (Math.PI * i) / latBands - Math.PI / 2;
          const row = [];
          for (let j = 0; j <= lonBands; j++) {
            const lon = (2 * Math.PI * j) / lonBands;
            row.push({
              x: radius * Math.cos(lat) * Math.cos(lon),
              y: radius * Math.sin(lat),
              z: radius * Math.cos(lat) * Math.sin(lon),
            });
          }
          points.push(row);
        }

        let angle = 0;
        const tilt = -0.28;
        let lastTime = performance.now();

        function rotate(p, a) {
          const cosA = Math.cos(a);
          const sinA = Math.sin(a);
          const x = p.x * cosA - p.z * sinA;
          const z = p.x * sinA + p.z * cosA;
          const cosT = Math.cos(tilt);
          const sinT = Math.sin(tilt);
          const y = p.y * cosT - z * sinT;
          const z2 = p.y * sinT + z * cosT;
          return { x, y, z: z2 };
        }

        function project(p) {
          const scale = focal / (focal + p.z);
          return { x: cx + p.x * scale, y: cy + p.y * scale, depth: p.z };
        }

        function drawLine(p1, p2) {
          const avgZ = (p1.z + p2.z) / 2;
          const depth = (avgZ + radius) / (radius * 2);
          const alpha = Math.max(0.45, Math.min(1, depth + 0.2));
          ctx.strokeStyle = `rgba(70, 255, 150, ${alpha})`;
          ctx.lineWidth = 1.6 + depth * 1.4;
          ctx.shadowColor = 'rgba(70, 255, 150, 0.9)';
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }

        function render(now) {
          const dt = (now - lastTime) / 1000;
          lastTime = now;
          angle += dt * 0.35;

          ctx.clearRect(0, 0, size, size);

          const projected = points.map((row) => row.map((p) => project(rotate(p, angle))));

          for (let i = 0; i <= latBands; i++) {
            for (let j = 0; j < lonBands; j++) {
              drawLine(projected[i][j], projected[i][j + 1]);
            }
          }
          for (let j = 0; j <= lonBands; j++) {
            for (let i = 0; i < latBands; i++) {
              drawLine(projected[i][j], projected[i + 1][j]);
            }
          }

          requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
      })();

      /* ---------- Terminal boot sequence ---------- */
      const terminalBody = document.getElementById('terminalBody');

      function typeLine(text, speed = 16) {
        return new Promise((resolve) => {
          const line = document.createElement('div');
          line.className = 'terminal-line';
          terminalBody.appendChild(line);
          let i = 0;
          const cursor = document.createElement('span');
          cursor.className = 'cursor-block';

          function step() {
            if (i <= text.length) {
              line.textContent = text.slice(0, i);
              line.appendChild(cursor);
              i++;
              setTimeout(step, speed);
            } else {
              cursor.remove();
              resolve();
            }
          }
          step();
        });
      }

      async function bootSequence() {
        const lines = [
          'booting anita_os v2.0 ...',
          'loading profile [Anita Chaudhary]',
          'role: Full-Stack Developer',
          'type a command below',
        ];
        for (const l of lines) {
          await typeLine('> ' + l);
        }
        renderPrompt();
      }

      function renderPrompt() {
        const launchRow = document.createElement('div');
        launchRow.className = 'terminal-line';
        launchRow.innerHTML = '<span class="prompt">anita@portfolio:~$</span> <button class="cmd-btn" id="launchBtn">launch workspace</button>';
        terminalBody.appendChild(launchRow);

        const downloadRow = document.createElement('div');
        downloadRow.className = 'terminal-line';
        downloadRow.innerHTML = '<span class="prompt">anita@portfolio:~$</span> <button class="cmd-btn" id="downloadBtn">download cv</button>';
        terminalBody.appendChild(downloadRow);

        const subOptions = document.createElement('div');
        subOptions.className = 'sub-options';
        subOptions.id = 'downloadOptions';
        subOptions.innerHTML = `
          <div class="terminal-line"><span class="prompt">  &gt;</span> <a href="anita-chaudhary-cv-en.html?print=1" target="_blank" rel="noopener">english</a></div>
          <div class="terminal-line"><span class="prompt">  &gt;</span> <a href="anita-chaudhary-cv-fr.html?print=1" target="_blank" rel="noopener">français</a></div>
        `;
        terminalBody.appendChild(subOptions);

        const finalRow = document.createElement('div');
        finalRow.className = 'terminal-line';
        finalRow.innerHTML = '<span class="prompt">anita@portfolio:~$</span> <span class="cursor-block"></span>';
        terminalBody.appendChild(finalRow);

        document.getElementById('launchBtn').addEventListener('click', launchWorkspace);
        document.getElementById('downloadBtn').addEventListener('click', () => {
          subOptions.classList.toggle('open');
        });
      }

      bootSequence();

      /* ---------- Icons ---------- */
      const icons = {
        resume: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="16" y2="17"></line></svg>',

      /* ---------- App registry ---------- */
      const apps = [
        { id: 'resume', label: 'Resume', icon: icons.resume, render: renderResume },
        { id: 'skills', label: 'Skills', icon: icons.skills, render: renderSkills },
        { id: 'experience', label: 'Experience', icon: icons.experience, render: renderExperience },
        { id: 'projects', label: 'Projects', icon: icons.projects, render: renderProjects },
        { id: 'contact', label: 'Contact', icon: icons.contact, render: renderContact },
        { id: 'analytics', label: 'Analytics', icon: icons.analytics, render: renderAnalytics },
        { id: 'github', label: 'GitHub Activity', icon: icons.github, render: renderGithubActivity },
      ];

      /* ---------- Desktop icons ---------- */
      const desktopIcons = document.getElementById('desktopIcons');
      apps.forEach((app) => {
        const btn = document.createElement('button');
        btn.className = 'desktop-icon';
        btn.innerHTML = `<span class="icon-box">${app.icon}</span><span class="label">${app.label}</span>`;
        btn.addEventListener('click', () => openApp(app.id));
        desktopIcons.appendChild(btn);
      });

      /* ---------- Window manager ---------- */
      const windowsLayer = document.getElementById('windowsLayer');
      const taskbarApps = document.getElementById('taskbarApps');
      const openWindows = {};
      let zIndexCounter = 10;
      let cascadeOffset = 0;

      function updateTaskbar() {
        taskbarApps.innerHTML = '';
        Object.keys(openWindows).forEach((id) => {
          const app = apps.find((a) => a.id === id);
          const btn = document.createElement('button');
          btn.className = 'taskbar-app-btn';
          btn.textContent = app.label;
          btn.addEventListener('click', () => {
            const win = openWindows[id];
            win.classList.remove('minimized');
            focusWindow(win);
          });
          taskbarApps.appendChild(btn);
        });
      }

      function focusWindow(win) {
        Object.values(openWindows).forEach((w) => w.style.zIndex = 10);
        win.style.zIndex = ++zIndexCounter;
      }

      function makeDraggable(win, handle) {
        let offsetX = 0;
        let offsetY = 0;

        handle.addEventListener('mousedown', (e) => {
          e.preventDefault();
          offsetX = e.clientX - win.offsetLeft;
          offsetY = e.clientY - win.offsetTop;
          focusWindow(win);

          function onMove(ev) {
            win.style.left = `${ev.clientX - offsetX}px`;
            win.style.top = `${Math.max(0, ev.clientY - offsetY)}px`;
          }

          function onUp() {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
          }

          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
      }

      function wireTabs(win) {
        win.querySelectorAll('[data-tab]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const tabsContainer = btn.closest('.tabs');
            const body = btn.closest('.window-body');
            tabsContainer.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            body.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
            body.querySelector(`[data-panel="${btn.dataset.tab}"]`).classList.add('active');
          });
        });
      }

      function openApp(appId) {
        if (openWindows[appId]) {
          openWindows[appId].classList.remove('minimized');
          focusWindow(openWindows[appId]);
          return;
        }

        const app = apps.find((a) => a.id === appId);
        const win = document.createElement('div');
        win.className = 'window';
        win.style.left = `${180 + cascadeOffset}px`;
        win.style.top = `${50 + cascadeOffset}px`;
        cascadeOffset = (cascadeOffset + 32) % 200;

        win.innerHTML = `
          <div class="window-titlebar">
            <span class="window-title">${app.icon}<span>${app.label}</span></span>
            <div class="window-controls">
              <button class="win-btn min" title="Minimize">–</button>
              <button class="win-btn close" title="Close">×</button>
            </div>
          </div>
          <div class="window-body">${app.render()}</div>
        `;

        windowsLayer.appendChild(win);
        openWindows[appId] = win;

        win.querySelector('.close').addEventListener('click', (e) => {
          e.stopPropagation();
          win.remove();
          delete openWindows[appId];
          updateTaskbar();
        });

        win.querySelector('.min').addEventListener('click', (e) => {
          e.stopPropagation();
          win.classList.add('minimized');
        });

        win.addEventListener('mousedown', () => focusWindow(win));
        makeDraggable(win, win.querySelector('.window-titlebar'));
        wireTabs(win);
        focusWindow(win);
        updateTaskbar();
      }

      /* ---------- Clock ---------- */
      const clockEl = document.getElementById('clock');
      function tickClock() {
        clockEl.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      tickClock();
      setInterval(tickClock, 1000 * 30);

      /* ---------- Launch transition ---------- */
      const landing = document.getElementById('landing');
      const desktop = document.getElementById('desktop');
      function launchWorkspace() {
        landing.classList.add('launching');
        desktop.classList.add('active');
        setTimeout(() => {
          landing.style.display = 'none';
          openApp('resume');
        }, 700);
      }
